# Install as /etc/systemd/system/orcasmakers.service.d/webrtc.conf.
[Service]
Environment=ENVIRONMENT=production
Environment=PUBLIC_ORIGIN=https://orcasmaker.com
Environment=TURN_HOST=turn.orcasmaker.com
Environment=TURN_PORT=3478
Environment=TURN_CREDENTIAL_TTL=3600
Environment=TURN_SHARED_SECRET_FILE=/etc/orcasmakers/turn-shared-secret
Environment=ROBOT_WEBRTC_TOKEN_FILE=/etc/orcasmakers/robot-webrtc-token
