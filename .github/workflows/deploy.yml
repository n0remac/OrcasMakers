name: Deploy OrcasMakers

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux/amd64
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o dist/orcasmakers .
          tar -cf dist/open-sauce-media.tar open-sauce-media

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp dist/orcasmakers "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/tmp/orcasmakers"
          scp dist/open-sauce-media.tar "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/tmp/open-sauce-media.tar"

      - name: Activate + restart
        run: |
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" << 'EOF'
          set -euo pipefail

          if [[ ! -w /srv/orcasmakers/app ]]; then
            echo "deploy user cannot write to /srv/orcasmakers/app" >&2
            exit 1
          fi

          install -m 0755 /tmp/orcasmakers /srv/orcasmakers/app/orcasmakers

          rm -rf /srv/orcasmakers/app/open-sauce-media.next
          mkdir -p /srv/orcasmakers/app/open-sauce-media.next
          tar -xf /tmp/open-sauce-media.tar -C /srv/orcasmakers/app/open-sauce-media.next --strip-components=1

          rm -rf /srv/orcasmakers/app/open-sauce-media.previous
          if [[ -d /srv/orcasmakers/app/open-sauce-media ]]; then
            mv /srv/orcasmakers/app/open-sauce-media /srv/orcasmakers/app/open-sauce-media.previous
          fi
          mv /srv/orcasmakers/app/open-sauce-media.next /srv/orcasmakers/app/open-sauce-media
          rm -rf /srv/orcasmakers/app/open-sauce-media.previous

          sudo -n /usr/bin/systemctl restart orcasmakers.service
          EOF
